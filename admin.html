<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOIR — Administration</title>

<link rel="icon" href="noir.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">


<style>

:root{

    --black:#050505;
    --gold:#c8a45d;
    --white:#f4f0e8;
    --muted:#77726b;

}

*{

    margin:0;
    padding:0;
    box-sizing:border-box;

}

body{

    min-height:100vh;

    background:

    radial-gradient(
        circle at 50% 20%,
        rgba(200,164,93,.09),
        transparent 35%
    ),

    #050505;

    color:var(--white);

    font-family:"Montserrat",sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

}


.login{

    width:100%;

    max-width:440px;

    padding:55px 40px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.05),
        rgba(255,255,255,.01)
    );

    border:1px solid rgba(200,164,93,.18);

    backdrop-filter:blur(25px);

    text-align:center;

    box-shadow:
    0 30px 100px rgba(0,0,0,.5);

}


.logo{

    font-family:"Cormorant Garamond",serif;

    font-size:48px;

    letter-spacing:8px;

    margin-bottom:7px;

}


.subtitle{

    color:var(--gold);

    font-size:7px;

    letter-spacing:4px;

    text-transform:uppercase;

    margin-bottom:45px;

}


.label{

    display:block;

    text-align:left;

    color:#77726b;

    font-size:8px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:9px;

}


input{

    width:100%;

    height:52px;

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.1);

    color:var(--white);

    padding:0 16px;

    outline:none;

    margin-bottom:20px;

    font-family:inherit;

}


input:focus{

    border-color:var(--gold);

}


button{

    width:100%;

    height:55px;

    border:1px solid var(--gold);

    background:var(--gold);

    color:#050505;

    font-family:inherit;

    font-size:8px;

    letter-spacing:3px;

    text-transform:uppercase;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    background:transparent;

    color:var(--gold);

}


button:disabled{

    opacity:.6;

    cursor:not-allowed;

}


#error{

    color:#b56b5e;

    font-size:8px;

    margin-top:18px;

    line-height:1.6;

    display:none;

}


.back{

    display:block;

    margin-top:25px;

    color:#625e58;

    font-size:8px;

    text-decoration:none;

    letter-spacing:1px;

}


.back:hover{

    color:var(--gold);

}


</style>

</head>


<body>


<div class="login">


<div class="logo">

NOIR

</div>


<div class="subtitle">

Fragrance · Administration

</div>



<form id="loginForm">


<label class="label">

Admin Email

</label>


<input

type="email"

id="email"

placeholder="admin@email.com"

required

autocomplete="username"

>


<label class="label">

Password

</label>


<input

type="password"

id="password"

placeholder="••••••••"

required

autocomplete="current-password"

>


<button

type="submit"

id="loginButton">

Enter Administration

</button>


</form>



<div id="error"></div>


<a href="index.html" class="back">

← Return to NOIR

</a>


</div>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */


import {

    initializeApp

}

from

"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

    getAuth,

    signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";



/* =========================================================
   NOIR FIREBASE CONFIG
========================================================= */


const firebaseConfig = {

    apiKey:
    "AIzaSyDN5Qlef7d85fa_9bwUDoXWAK5ieZj689",

    authDomain:
    "noirfragrance-8ced0.firebaseapp.com",

    projectId:
    "noirfragrance-8ced0",

    storageBucket:
    "noirfragrance-8ced0.firebasestorage.app",

    messagingSenderId:
    "145638482773",

    appId:
    "1:145638482773:web:7bda6aeb879bb0afb1c5dc",

    measurementId:
    "G-32G9NZFQD2"

};


/* =========================================================
   INITIALIZE FIREBASE
========================================================= */


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);



/* =========================================================
   ELEMENTS
========================================================= */


const form =
document.getElementById("loginForm");


const email =
document.getElementById("email");


const password =
document.getElementById("password");


const button =
document.getElementById("loginButton");


const error =
document.getElementById("error");



/* =========================================================
   LOGIN
========================================================= */


form.addEventListener("submit", async (event)=>{

    event.preventDefault();


    error.style.display = "none";


    button.disabled = true;

    button.textContent = "AUTHENTICATING...";


    try{


        await signInWithEmailAndPassword(

            auth,

            email.value.trim(),

            password.value

        );


        /*
            Login successful.

            For now we'll send you to the
            admin dashboard page.
        */


        window.location.href =
            "admin-dashboard.html";


    }


    catch(err){


        console.error(err);


        error.style.display = "block";


        if(

            err.code ===
            "auth/invalid-credential"

        ){

            error.textContent =
            "Invalid admin email or password.";

        }

        else if(

            err.code ===
            "auth/too-many-requests"

        ){

            error.textContent =
            "Too many attempts. Please try again later.";

        }

        else{

            error.textContent =
            "Unable to sign in. Please check your details.";

        }


        button.disabled = false;

        button.textContent =
            "ENTER ADMINISTRATION";

    }

});

</script>


</body>

</html>

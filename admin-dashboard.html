<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOIR FRAGRANCE — Order Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --black:#050505;
    --dark:#0b0b0b;
    --gold:#c8a45d;
    --white:#f4f0e8;
    --muted:#817c75;
    --border:rgba(255,255,255,.09);
    --green:#6fa98a;
    --red:#b86b6b;

    --serif:"Cormorant Garamond",serif;
    --sans:"Montserrat",sans-serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    radial-gradient(
        circle at 80% 0%,
        rgba(200,164,93,.07),
        transparent 32%
    ),
    var(--black);

    color:var(--white);

    font-family:var(--sans);

    min-height:100vh;

}

button,
select{

    font-family:inherit;

}


/* ================= HEADER ================= */

header{

    position:sticky;

    top:0;

    z-index:100;

    background:rgba(5,5,5,.9);

    backdrop-filter:blur(20px);

    border-bottom:1px solid var(--border);

}

.nav{

    max-width:1500px;

    margin:auto;

    padding:20px 5%;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.logo{

    display:flex;

    flex-direction:column;

}

.logo strong{

    font-family:var(--serif);

    font-size:29px;

    letter-spacing:6px;

}

.logo small{

    color:var(--gold);

    font-size:7px;

    letter-spacing:4px;

    margin-top:3px;

}

.nav-right{

    display:flex;

    align-items:center;

    gap:18px;

}

.admin-email{

    color:#77726b;

    font-size:8px;

}

.logout{

    border:1px solid rgba(200,164,93,.4);

    background:transparent;

    color:var(--gold);

    padding:10px 16px;

    cursor:pointer;

    font-size:8px;

    letter-spacing:2px;

    text-transform:uppercase;

}


/* ================= MAIN ================= */

.container{

    max-width:1500px;

    margin:auto;

    padding:55px 5% 100px;

}

.eyebrow{

    color:var(--gold);

    font-size:8px;

    letter-spacing:4px;

    text-transform:uppercase;

    margin-bottom:12px;

}

.heading{

    margin-bottom:45px;

}

.heading h1{

    font-family:var(--serif);

    font-size:68px;

    font-weight:500;

    line-height:.9;

}

.heading p{

    color:#77726b;

    font-size:9px;

    margin-top:15px;

}


/* ================= STATS ================= */

.stats{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:15px;

    margin-bottom:45px;

}

.stat{

    border:1px solid var(--border);

    background:rgba(255,255,255,.02);

    padding:25px;

}

.stat-label{

    color:#77726b;

    font-size:8px;

    letter-spacing:2px;

    text-transform:uppercase;

}

.stat-value{

    color:var(--gold);

    font-family:var(--serif);

    font-size:40px;

    margin-top:10px;

}


/* ================= ORDERS HEADER ================= */

.orders-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;

}

.orders-header h2{

    font-family:var(--serif);

    font-size:40px;

    font-weight:500;

}

.refresh{

    border:1px solid var(--border);

    background:transparent;

    color:var(--gold);

    padding:11px 18px;

    cursor:pointer;

    font-size:8px;

    letter-spacing:2px;

}


/* ================= ORDERS ================= */

.orders-list{

    display:flex;

    flex-direction:column;

    gap:18px;

}

.empty{

    border:1px solid var(--border);

    padding:90px 25px;

    text-align:center;

    color:#77726b;

    font-size:10px;

}


/* ================= ORDER CARD ================= */

.order-card{

    border:1px solid var(--border);

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.04),
        rgba(255,255,255,.01)
    );

}


/* ================= ORDER TOP ================= */

.order-top{

    padding:22px 25px;

    border-bottom:1px solid var(--border);

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:20px;

}

.order-id{

    color:var(--gold);

    font-size:9px;

    letter-spacing:2px;

}

.order-date{

    color:#625e58;

    font-size:8px;

    margin-top:7px;

}

.order-actions{

    display:flex;

    align-items:center;

    gap:10px;

}

.status{

    background:#080808;

    color:var(--gold);

    border:1px solid rgba(200,164,93,.35);

    padding:10px;

    font-size:8px;

    outline:none;

    cursor:pointer;

}

.delete{

    border:1px solid rgba(184,107,107,.35);

    background:transparent;

    color:var(--red);

    padding:10px 13px;

    cursor:pointer;

    font-size:8px;

}


/* ================= ORDER INFO ================= */

.order-info{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:30px;

    padding:25px;

}

.info-title{

    color:var(--gold);

    font-size:8px;

    letter-spacing:3px;

    text-transform:uppercase;

    margin-bottom:14px;

}

.customer p{

    color:#aaa59e;

    font-size:9px;

    line-height:2;

}

.customer strong{

    color:var(--white);

    font-weight:500;

}

.address{

    color:#aaa59e;

    font-size:9px;

    line-height:1.9;

}


/* ================= PRODUCTS ================= */

.products{

    border-top:1px solid var(--border);

    padding:25px;

}

.product{

    display:flex;

    align-items:center;

    gap:15px;

    padding:13px 0;

    border-bottom:1px solid rgba(255,255,255,.05);

}

.product:last-child{

    border-bottom:none;

}

.product img{

    width:55px;

    height:60px;

    object-fit:contain;

    background:rgba(255,255,255,.02);

}

.product-info{

    flex:1;

}

.product-name{

    font-family:var(--serif);

    font-size:21px;

}

.product-meta{

    color:#6f6a63;

    font-size:8px;

    margin-top:5px;

}

.product-price{

    color:var(--gold);

    font-size:9px;

}


/* ================= TOTAL ================= */

.order-total{

    border-top:1px solid var(--border);

    padding:22px 25px;

    display:flex;

    justify-content:flex-end;

}

.total-box{

    width:300px;

}

.total-row{

    display:flex;

    justify-content:space-between;

    padding:7px 0;

    color:#77726b;

    font-size:9px;

}

.total-row.final{

    border-top:1px solid var(--border);

    margin-top:8px;

    padding-top:15px;

    color:var(--white);

    font-size:14px;

}

.total-row.final span:last-child{

    color:var(--gold);

}


/* ================= MOBILE ================= */

@media(max-width:900px){

    .stats{

        grid-template-columns:
        1fr 1fr;

    }

    .order-info{

        grid-template-columns:
        1fr;

    }

}

@media(max-width:650px){

    .container{

        padding:40px 5% 80px;

    }

    .heading h1{

        font-size:50px;

    }

    .stats{

        grid-template-columns:
        1fr 1fr;

    }

    .stat{

        padding:18px;

    }

    .stat-value{

        font-size:30px;

    }

    .admin-email{

        display:none;

    }

    .order-top{

        flex-direction:column;

        align-items:flex-start;

    }

    .order-actions{

        width:100%;

    }

    .status{

        flex:1;

    }

    .order-total{

        justify-content:stretch;

    }

    .total-box{

        width:100%;

    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

<div class="nav">

<div class="logo">

<strong>NOIR</strong>

<small>FRAGRANCE · ADMINISTRATION</small>

</div>


<div class="nav-right">

<div
class="admin-email"
id="adminEmail">
</div>

<button
class="logout"
id="logoutButton">

Logout

</button>

</div>

</div>

</header>


<!-- ================= MAIN ================= -->

<main class="container">


<section class="heading">

<div class="eyebrow">
NOIR FRAGRANCE
</div>

<h1>
Order Dashboard
</h1>

<p>
Every order received from your store, in one place.
</p>

</section>


<!-- ================= STATS ================= -->

<section class="stats">


<div class="stat">

<div class="stat-label">
Total Orders
</div>

<div
class="stat-value"
id="totalOrders">
0
</div>

</div>


<div class="stat">

<div class="stat-label">
Pending
</div>

<div
class="stat-value"
id="pendingOrders">
0
</div>

</div>


<div class="stat">

<div class="stat-label">
Delivered
</div>

<div
class="stat-value"
id="deliveredOrders">
0
</div>

</div>


<div class="stat">

<div class="stat-label">
Revenue
</div>

<div
class="stat-value"
id="revenue">
Rs. 0
</div>

</div>


</section>


<!-- ================= ORDERS ================= -->

<section>


<div class="orders-header">

<h2>
Orders
</h2>

<button
class="refresh"
id="refreshButton">

Refresh

</button>

</div>


<div
class="orders-list"
id="ordersList">

<div class="empty">
Loading orders...
</div>

</div>


</section>


</main>


<!-- ================= FIREBASE ================= -->

<script type="module">


import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {

    getAuth,

    onAuthStateChanged,

    signOut

}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {

    getDatabase,

    ref,

    onValue,

    update,

    remove

}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyCCxNTzbQmMIHhi0BO0LpGbWcR4IWW7yQg",

    authDomain:
    "noirfragrance-7c5e5.firebaseapp.com",

    databaseURL:
    "https://noirfragrance-7c5e5-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "noirfragrance-7c5e5",

    storageBucket:
    "noirfragrance-7c5e5.firebasestorage.app",

    messagingSenderId:
    "162914791523",

    appId:
    "1:162914791523:web:ef39fe95d1f7312a71c856"

};


/* ================= INITIALIZE ================= */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* ================= ELEMENTS ================= */

const ordersList =
document.getElementById(
    "ordersList"
);

const adminEmail =
document.getElementById(
    "adminEmail"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);

const refreshButton =
document.getElementById(
    "refreshButton"
);


/* ================= AUTH ================= */

onAuthStateChanged(
    auth,
    user => {

        if(!user){

            window.location.href =
            "admin.html";

            return;

        }

        adminEmail.textContent =
        user.email || "";

        loadOrders();

    }
);


/* ================= LOGOUT ================= */

logoutButton.addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.href =
        "admin.html";

    }
);


/* ================= LOAD ORDERS ================= */

let stopOrdersListener = null;


function loadOrders(){

    if(stopOrdersListener){

        stopOrdersListener();

    }


    const ordersRef =
    ref(
        db,
        "orders"
    );


    stopOrdersListener =
    onValue(
        ordersRef,
        snapshot => {

            const data =
            snapshot.val() || {};

            renderOrders(data);

        },
        error => {

            console.error(
                error
            );

            ordersList.innerHTML = `

                <div class="empty">

                    Unable to load orders.
                    Please check Firebase Database Rules.

                </div>

            `;

        }
    );

}


/* ================= RENDER ================= */

function renderOrders(data){

    ordersList.innerHTML = "";


    const orders =
    Object.entries(data);


    if(!orders.length){

        ordersList.innerHTML = `

            <div class="empty">

                No orders received yet.

            </div>

        `;

        updateStats([]);

        return;

    }


    orders.sort(
        (a,b) => {

            return new Date(
                b[1].createdAt || 0
            ) -
            new Date(
                a[1].createdAt || 0
            );

        }
    );


    orders.forEach(
        ([key,order]) => {

            ordersList.appendChild(
                createOrder(
                    key,
                    order
                )
            );

        }
    );


    updateStats(
        orders.map(
            item => item[1]
        )
    );

}


/* ================= ORDER ================= */

function createOrder(
    key,
    order
){

    const card =
    document.createElement(
        "article"
    );

    card.className =
    "order-card";


    const customer =
    order.customer || {};


    let items = [];


    if(Array.isArray(order.items)){

        items =
        order.items;

    }
    else{

        items =
        Object.values(
            order.items || {}
        );

    }


    const date =
    order.createdAt
    ?
    new Date(
        order.createdAt
    ).toLocaleString()
    :
    "Unknown";


    const status =
    order.status ||
    "Pending";


    card.innerHTML = `

        <div class="order-top">

            <div>

                <div class="order-id">

                    ${escapeHTML(
                        order.orderId ||
                        key
                    )}

                </div>

                <div class="order-date">

                    ${escapeHTML(date)}

                </div>

            </div>


            <div class="order-actions">

                <select class="status">

                    ${option(
                        "Pending",
                        status
                    )}

                    ${option(
                        "Confirmed",
                        status
                    )}

                    ${option(
                        "Shipped",
                        status
                    )}

                    ${option(
                        "Delivered",
                        status
                    )}

                    ${option(
                        "Cancelled",
                        status
                    )}

                </select>


                <button class="delete">

                    Delete

                </button>

            </div>

        </div>


        <div class="order-info">


            <div class="customer">

                <div class="info-title">
                    Customer
                </div>

                <p>
                    <strong>Name:</strong>
                    ${escapeHTML(
                        customer.name || "-"
                    )}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${escapeHTML(
                        customer.phone || "-"
                    )}
                </p>

                <p>
                    <strong>Email:</strong>
                    ${escapeHTML(
                        customer.email || "-"
                    )}
                </p>

                <p>
                    <strong>City:</strong>
                    ${escapeHTML(
                        customer.city || "-"
                    )}
                </p>

                <p>
                    <strong>Payment:</strong>
                    ${escapeHTML(
                        order.paymentMethod ||
                        "-"
                    )}
                </p>

            </div>


            <div>

                <div class="info-title">
                    Delivery Address
                </div>

                <div class="address">

                    ${escapeHTML(
                        customer.address || "-"
                    )}

                </div>

            </div>


        </div>


        <div class="products">

            <div class="info-title">
                Ordered Products
            </div>

            ${items.map(
                item => {

                    const quantity =
                    Number(
                        item.quantity
                    ) || 1;

                    const price =
                    Number(
                        item.price
                    ) || 0;


                    return `

                        <div class="product">

                            <img
                                src="${
                                    item.image ||
                                    "noir.png"
                                }"
                                alt=""
                            >

                            <div class="product-info">

                                <div
                                    class="product-name">

                                    ${escapeHTML(
                                        item.name ||
                                        "NOIR FRAGRANCE"
                                    )}

                                </div>

                                <div
                                    class="product-meta">

                                    ${escapeHTML(
                                        item.size ||
                                        "50 ML"
                                    )}

                                    ×

                                    ${quantity}

                                </div>

                            </div>

                            <div
                                class="product-price">

                                ${formatPrice(
                                    price *
                                    quantity
                                )}

                            </div>

                        </div>

                    `;

                }
            ).join("")}

        </div>


        <div class="order-total">

            <div class="total-box">

                <div class="total-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ${formatPrice(
                            order.subtotal || 0
                        )}
                    </span>

                </div>


                <div class="total-row">

                    <span>
                        Delivery
                    </span>

                    <span>
                        ${formatPrice(
                            order.delivery || 0
                        )}
                    </span>

                </div>


                <div class="total-row final">

                    <span>
                        Total
                    </span>

                    <span>
                        ${formatPrice(
                            getTotal(order)
                        )}
                    </span>

                </div>

            </div>

        </div>

    `;


    /* ================= STATUS ================= */

    const statusSelect =
    card.querySelector(
        ".status"
    );


    statusSelect.addEventListener(
        "change",
        async () => {

            try{

                await update(
                    ref(
                        db,
                        "orders/" + key
                    ),
                    {
                        status:
                        statusSelect.value
                    }
                );

            }
            catch(error){

                console.error(error);

                alert(
                    "Unable to update order."
                );

            }

        }
    );


    /* ================= DELETE ================= */

    const deleteButton =
    card.querySelector(
        ".delete"
    );


    deleteButton.addEventListener(
        "click",
        async () => {

            const confirmDelete =
            confirm(
                "Delete this order permanently?"
            );


            if(!confirmDelete){

                return;

            }


            try{

                await remove(
                    ref(
                        db,
                        "orders/" + key
                    )
                );

            }
            catch(error){

                console.error(error);

                alert(
                    "Unable to delete order."
                );

            }

        }
    );


    return card;

}


/* ================= OPTION ================= */

function option(
    value,
    current
){

    return `

        <option
            value="${value}"
            ${
                value === current
                ? "selected"
                : ""
            }>

            ${value}

        </option>

    `;

}


/* ================= STATS ================= */

function updateStats(
    orders
){

    let pending = 0;

    let delivered = 0;

    let revenue = 0;


    orders.forEach(
        order => {

            const status =
            order.status ||
            "Pending";


            if(status === "Pending"){

                pending++;

            }


            if(status === "Delivered"){

                delivered++;

            }


            if(
                status !== "Cancelled"
            ){

                revenue +=
                getTotal(order);

            }

        }
    );


    document.getElementById(
        "totalOrders"
    ).textContent =
    orders.length;


    document.getElementById(
        "pendingOrders"
    ).textContent =
    pending;


    document.getElementById(
        "deliveredOrders"
    ).textContent =
    delivered;


    document.getElementById(
        "revenue"
    ).textContent =
    formatPrice(revenue);

}


/* ================= TOTAL ================= */

function getTotal(order){

    if(
        order.total !== undefined &&
        order.total !== null
    ){

        return Number(
            order.total
        ) || 0;

    }


    return (
        Number(
            order.subtotal
        ) || 0
    )
    +
    (
        Number(
            order.delivery
        ) || 0
    );

}


/* ================= FORMAT ================= */

function formatPrice(
    price
){

    return "Rs. " +
    Number(
        price || 0
    ).toLocaleString();

}


/* ================= SECURITY ================= */

function escapeHTML(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================= REFRESH ================= */

refreshButton.addEventListener(
    "click",
    () => {

        loadOrders();

    }
);

</script>

</body>

</html>
